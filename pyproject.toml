[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-sourced-orders"
version = "0.1.0"
description = "Event-sourced orders and payments on a partitioned log, with idempotent consumers and a transactional outbox. Standard library only."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shourie Amireddy", email = "shourie3009@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
esorders = "esorders.cli:main"

[tool.setuptools]
packages = ["esorders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
